spring:
  application:
    name: quick-dev-demo
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:quickdev;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Sa-Token：token 从 Authorization 请求头读写，与框架拦截器保持一致
sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-log: false

quick-dev:
  enabled: true
  db-type: h2
  # 防御性上限沿用框架默认值（导出 100000 / 导入 10000 / 不分页查询 1000 / IN 1000）；
  # 需要验证"超限"行为的测试自己在测试内用 QuickDevLimits 调整并还原。
  dict:
    # 框架不查库：demo 自定义 DbDictLoader 提供数据（远程服务/配置中心同理）
    refresh-interval-seconds: 2   # 定时自动刷新演示（多实例最终一致方案，默认 0 禁用）
  log:
    enabled: true
  auth:
    enabled: true
    token-header: Authorization
    # 0.4.0 起默认禁用 URL 传 token（会泄露到访问日志/历史记录）；demo 不重新开启

logging:
  level:
    dev.xuya: info
